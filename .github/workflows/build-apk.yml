name: Build Ankit AI Trader APK

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ankit_ai_trader_mobile_v1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Ensure Android launcher icons & wrapper
        run: |
          flutter create . --project-name ankit_ai_trader --org com.ankit --platforms android

      - name: Install dependencies
        run: flutter pub get

      - name: Run automated unit & integration tests (Stage 20)
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Package APK for download
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk ../Ankit_AI_Trader.apk

      - name: Upload Final Downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: Ankit_AI_Trader_APK
          path: Ankit_AI_Trader.apk
          retention-days: 90
