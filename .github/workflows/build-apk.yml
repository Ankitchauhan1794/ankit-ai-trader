
name: Build Ankit AI Trader APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract cloud build kit
        shell: bash
        run: |
          set -e
          mkdir -p workspace
          unzip -q Ankit_AI_Trader_GitHub_Cloud_Build_Kit.zip -d workspace

      - name: Extract Android source project
        shell: bash
        run: |
          set -e
          unzip -q workspace/Ankit_AI_Trader_Android_V1_1_Background_Source.zip -d workspace

          test -f workspace/ankit_ai_trader_mobile_v1/pubspec.yaml
          test -f workspace/ankit_ai_trader_mobile_v1/lib/main.dart

      - name: Generate Flutter Android wrapper
        shell: bash
        run: |
          set -e
          cd workspace/ankit_ai_trader_mobile_v1

          mkdir -p /tmp/ankit-native

          cp android/app/src/main/AndroidManifest.xml /tmp/ankit-native/AndroidManifest.xml
          cp -R android/app/src/main/kotlin /tmp/ankit-native/kotlin

          flutter create . --platforms=android --project-name=ankit_ai_trader --org=com.ankit

          cp /tmp/ankit-native/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

          rm -rf android/app/src/main/kotlin
          cp -R /tmp/ankit-native/kotlin android/app/src/main/kotlin

      - name: Pin compatible Android build tools
        shell: bash
        run: |
          set -e
          cd workspace/ankit_ai_trader_mobile_v1

          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream { properties.load(it) }
                  def flutterSdkPath = properties.getProperty("flutter.sdk")
                  assert flutterSdkPath != null
                  return flutterSdkPath
              }()
              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "8.6.1" apply false
              id "org.jetbrains.kotlin.android" version "2.1.0" apply false
          }

          rootProject.name = "AnkitAITrader"
          include(":app")
          EOF

          cat > android/build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.6.1" apply false
              id "org.jetbrains.kotlin.android" version "2.1.0" apply false
          }
          EOF

          cat > android/gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G
          android.useAndroidX=true
          EOF

          rm -f android/app/build.gradle.kts

          cat > android/app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
              id "org.jetbrains.kotlin.android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          android {
              namespace "com.ankit.aitrader"
              compileSdk 35

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              defaultConfig {
                  applicationId "com.ankit.aitrader"
                  minSdk 23
                  targetSdk 35
                  versionCode 2
                  versionName "1.1.0"
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }

          flutter {
              source "../.."
          }
          EOF

          echo "===== Gradle wrapper version ====="
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties

          echo "===== Android Gradle Plugin version ====="
          grep 'com.android.application' android/settings.gradle

      - name: Install Flutter dependencies
        working-directory: workspace/ankit_ai_trader_mobile_v1
        run: flutter pub get

      - name: Analyze application code
        working-directory: workspace/ankit_ai_trader_mobile_v1
        continue-on-error: true
        run: flutter analyze --no-pub lib

      - name: Build release APK
        working-directory: workspace/ankit_ai_trader_mobile_v1
        run: flutter build apk --release

      - name: Prepare APK
        shell: bash
        run: |
          set -e

          cp workspace/ankit_ai_trader_mobile_v1/build/app/outputs/flutter-apk/app-release.apk ./Ankit_AI_Trader.apk

          test -s ./Ankit_AI_Trader.apk

          echo "APK generated successfully:"
          ls -lh ./Ankit_AI_Trader.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ankit_AI_Trader_APK
          path: Ankit_AI_Trader.apk
          if-no-files-found: error
          retention-days: 14
