name: Build Ankit AI Trader APK

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ankit_ai_trader_mobile_v1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore original Gradle & pubspec files from feature/self-healing-background
        run: |
          git checkout origin/feature/self-healing-background -- pubspec.yaml pubspec.lock analysis_options.yaml android/build.gradle android/settings.gradle android/gradle.properties android/app/build.gradle android/app/src/main/res 2>/dev/null || true
          rm -f android/app/src/main/kotlin/com/ankit/aitrader/WatchdogWorker.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter 3.27.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run automated unit & integration tests (Stage 20)
        run: flutter test test/stages_1_to_20_test.dart

      - name: Build Release APK
        run: flutter build apk --release

      - name: Package APK for download
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk ../Ankit_AI_Trader.apk

      - name: Upload Final Downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: Ankit_AI_Trader_APK
          path: Ankit_AI_Trader.apk
          retention-days: 90
